plugins {
    id 'com.android.application'
}

// CI compatibility marker: 5.1.0-cli-real
android {
    namespace 'com.sayeh.aifilm'
    compileSdk 35

    defaultConfig {
        applicationId 'org.wifiusagemeter.app'
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// v1.2: inject the compact date-range filter into the verified v1.1 activity.
tasks.withType(JavaCompile).configureEach {
    doFirst {
        def f = file('src/main/java/org/sayeh/realwifi/UsageMeterActivity.java')
        if (!f.exists()) return
        def src = f.getText('UTF-8')
        if (!src.contains('private void showRangeChooser()')) {
            def dashboardMarker = '''        renderDashboardValues(u,true);\n'''
            def dashboardReplacement = '''        renderDashboardValues(u,true);\n        Button range=secondary("بازهٔ زمانی");\n        range.setOnClickListener(v->showRangeChooser());\n        root.addView(range);\n'''
            src = src.replace(dashboardMarker, dashboardReplacement)

            def methodMarker = '''    private void tapAdmin(){'''
            def methods = '''    private void showRangeChooser(){
        String[] items={"امروز","دیروز","۷ روز اخیر","۳۰ روز اخیر","این ماه","ماه گذشته","بازهٔ دلخواه"};
        new AlertDialog.Builder(this).setTitle("بازهٔ زمانی").setItems(items,(dialog,which)->{
            long now=System.currentTimeMillis();
            if(which==0){showRangeResult("امروز",startDay(now),now);return;}
            if(which==1){long end=startDay(now);showRangeResult("دیروز",addDays(end,-1),end);return;}
            if(which==2){showRangeResult("۷ روز اخیر",addDays(startDay(now),-6),now);return;}
            if(which==3){showRangeResult("۳۰ روز اخیر",addDays(startDay(now),-29),now);return;}
            if(which==4){showRangeResult("این ماه",startMonth(now),now);return;}
            if(which==5){Calendar c=Calendar.getInstance();c.setTimeInMillis(startMonth(now));long end=c.getTimeInMillis();c.add(Calendar.MONTH,-1);showRangeResult("ماه گذشته",c.getTimeInMillis(),end);return;}
            pickCustomRange();
        }).show();
    }

    private long addDays(long base,int days){Calendar c=Calendar.getInstance();c.setTimeInMillis(base);c.add(Calendar.DAY_OF_MONTH,days);return c.getTimeInMillis();}

    private void pickCustomRange(){
        Calendar now=Calendar.getInstance();
        new android.app.DatePickerDialog(this,(first,y,m,d)->{
            Calendar from=Calendar.getInstance();from.set(y,m,d,0,0,0);from.set(Calendar.MILLISECOND,0);
            new android.app.DatePickerDialog(this,(second,y2,m2,d2)->{
                Calendar to=Calendar.getInstance();to.set(y2,m2,d2,23,59,59);to.set(Calendar.MILLISECOND,999);
                if(to.getTimeInMillis()<from.getTimeInMillis()){toast("تاریخ پایان باید بعد از تاریخ آغاز باشد");return;}
                long end=Math.min(to.getTimeInMillis(),System.currentTimeMillis());
                showRangeResult("بازهٔ انتخاب‌شده",from.getTimeInMillis(),end);
            },now.get(Calendar.YEAR),now.get(Calendar.MONTH),now.get(Calendar.DAY_OF_MONTH)).show();
        },now.get(Calendar.YEAR),now.get(Calendar.MONTH),now.get(Calendar.DAY_OF_MONTH)).show();
    }

    private void showRangeResult(String label,long start,long end){
        if(!hasAccess()){toast("ابتدا دسترسی اندازه‌گیری را فعال کنید");return;}
        if(end<=start){toast("بازهٔ زمانی معتبر نیست");return;}
        worker.execute(()->{
            Totals t=query(start,end);
            runOnUiThread(()->{
                LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setPadding(dp(22),dp(8),dp(22),dp(4));
                TextView total=strong(fmt(t.total()));total.setTextSize(31);total.setGravity(Gravity.CENTER);total.setTextColor(0xFF0F766E);box.addView(total);
                TextView flow=small("دانلود: "+fmt(t.rx)+"     آپلود: "+fmt(t.tx));flow.setGravity(Gravity.CENTER);box.addView(flow);
                String dates=DateFormat.getDateInstance(DateFormat.MEDIUM,new Locale("fa","AF")).format(new Date(start))+"  تا  "+DateFormat.getDateInstance(DateFormat.MEDIUM,new Locale("fa","AF")).format(new Date(end));
                TextView period=small(dates);period.setGravity(Gravity.CENTER);box.addView(period);
                new AlertDialog.Builder(this).setTitle(label).setView(box).setPositiveButton("بستن",null).show();
            });
        });
    }

'''
            src = src.replace(methodMarker, methods + methodMarker)
            f.setText(src, 'UTF-8')
        }
    }
}
