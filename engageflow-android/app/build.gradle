plugins {
    id 'com.android.application'
}

android {
    namespace 'com.engageflow.af'
    compileSdk 35

    defaultConfig {
        applicationId 'com.engageflow.af'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
