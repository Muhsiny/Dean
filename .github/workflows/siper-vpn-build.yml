name: Build Siper VPN APK

on:
  push:
    branches: [ "siper-vpn-production" ]
    paths:
      - "siper-vpn/**"
      - ".github/workflows/siper-vpn-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siper-vpn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiperVPN-real-debug
          path: siper-vpn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
