name: Build Siper VPN APK

on:
  push:
    branches: [ "siper-vpn-production" ]
    paths:
      - "siper-vpn/**"
      - ".github/workflows/siper-vpn-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siper-vpn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup stable Android SDK base
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
      - name: Install current Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Android 37 canary platform
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          android sdk install --canary platforms/android-37 build-tools/37.0.0
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiperVPN-real-debug
          path: siper-vpn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
