name: Deploy Beheshti Edge Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-beheshti-edge.yml'
      - 'cloudflare/beheshti-university-edge.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN_4: ${{ secrets.CF_TOKEN }}
      CF_ACCOUNT_ID: 49e1ddcb14026517ec2d0b255f974e9f
      CF_GLOBAL_KEY_1: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CF_GLOBAL_KEY_2: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_EMAIL_1: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_EMAIL_2: ${{ secrets.CF_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${CF_TOKEN_1:-}"
          [ -n "$TOKEN" ] || TOKEN="${CF_TOKEN_2:-}"
          [ -n "$TOKEN" ] || TOKEN="${CF_TOKEN_3:-}"
          [ -n "$TOKEN" ] || TOKEN="${CF_TOKEN_4:-}"
          if [ -n "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            exit 0
          fi
          KEY="${CF_GLOBAL_KEY_1:-}"
          [ -n "$KEY" ] || KEY="${CF_GLOBAL_KEY_2:-}"
          EMAIL="${CF_EMAIL_1:-}"
          [ -n "$EMAIL" ] || EMAIL="${CF_EMAIL_2:-}"
          if [ -n "$KEY" ] && [ -n "$EMAIL" ]; then
            echo "CLOUDFLARE_API_KEY=$KEY" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_EMAIL=$EMAIL" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "No supported Cloudflare credential secret is configured." >&2
          exit 2
      - name: Deploy existing Worker script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy cloudflare/beheshti-university-edge.js \
            --name beheshti-university-edge \
            --compatibility-date 2026-09-18
