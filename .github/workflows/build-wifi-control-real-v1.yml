name: Build WiFi Control Real v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wifi-control-real-v1.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  android:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-CONTROL-REAL-V1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-usage-meter-native-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android
        shell: bash
        run: |
          set +e
          cd real-control
          gradle --no-daemon :androidApp:assembleDebug --stacktrace > ../android-build.log 2>&1
          rc=$?
          cd ..
          cat android-build.log
          echo "$rc" > android-exit.txt
          exit 0
      - name: Verify APK
        shell: bash
        run: |
          test "$(cat android-exit.txt)" = "0"
          APK=real-control/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee android-badging.txt
          grep -q "package: name='org.wifiusagemeter.app'" android-badging.txt
          grep -q "versionName='1.0.0'" android-badging.txt
          cp "$APK" WiFi-Usage-Meter-v1.apk
          sha256sum WiFi-Usage-Meter-v1.apk > WiFi-Usage-Meter-v1.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WiFi-Usage-Meter-v1
          path: |
            WiFi-Usage-Meter-v1.apk
            WiFi-Usage-Meter-v1.sha256
            android-build.log
            android-exit.txt
          if-no-files-found: ignore
      - name: Publish result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "$GITHUB_RUN_ID" > wifi-usage-native-run.txt
          cp WiFi-Usage-Meter-v1.apk ./ 2>/dev/null || true
          cp WiFi-Usage-Meter-v1.sha256 ./ 2>/dev/null || true
          cp android-build.log wifi-usage-native-build.log 2>/dev/null || true
          git add -f WiFi-Usage-Meter-v1.apk WiFi-Usage-Meter-v1.sha256 wifi-usage-native-run.txt wifi-usage-native-build.log 2>/dev/null || true
          git commit -m 'Publish WiFi Usage Meter APK [skip ci]' || true
          git push origin HEAD:wifi-usage-meter-native-v1 || true

# trigger native usage meter 2026-08-24
