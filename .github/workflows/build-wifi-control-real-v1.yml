name: Build WiFi Control Real v1

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  android:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-CONTROL-REAL-V1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-control-real-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android
        working-directory: real-control
        run: gradle --no-daemon :androidApp:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s real-control/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          unzip -t real-control/androidApp/build/outputs/apk/debug/androidApp-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging real-control/androidApp/build/outputs/apk/debug/androidApp-debug.apk | tee android-badging.txt
          grep -q "package: name='org.sayeh.realwifi'" android-badging.txt
          grep -q "versionName='1.0.0-real'" android-badging.txt
          cp real-control/androidApp/build/outputs/apk/debug/androidApp-debug.apk WiFi-Control-Real-v1-Android.apk
          sha256sum WiFi-Control-Real-v1-Android.apk > WiFi-Control-Real-v1-Android.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-Real-v1-Android
          path: |
            WiFi-Control-Real-v1-Android.apk
            WiFi-Control-Real-v1-Android.sha256

  windows:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-CONTROL-REAL-V1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-control-real-v1
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet restore real-control/windowsApp/WifiControl.Real.Windows.csproj
          dotnet publish real-control/windowsApp/WifiControl.Real.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/windows
          if (!(Test-Path dist/windows/WiFiControlReal.exe)) { throw 'Windows exe missing' }
          Compress-Archive -Path dist/windows/* -DestinationPath WiFi-Control-Real-v1-Windows.zip
          (Get-FileHash WiFi-Control-Real-v1-Windows.zip -Algorithm SHA256).Hash.ToLower() | Out-File WiFi-Control-Real-v1-Windows.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-Real-v1-Windows
          path: |
            WiFi-Control-Real-v1-Windows.zip
            WiFi-Control-Real-v1-Windows.sha256
