name: Build WiFi Usage Meter Chunked
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-USAGE-METER-CHUNKED'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-usage-meter-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reassemble project
        run: |
          rm -rf WiFiUsageMeter wifi-usage-meter-reassembled.zip
          cat wifi-usage-meter-parts/*.bin > wifi-usage-meter-reassembled.zip
          unzip -t wifi-usage-meter-reassembled.zip
          unzip -q wifi-usage-meter-reassembled.zip
          test -f WiFiUsageMeter/app/build.gradle.kts
      - name: Build APK
        working-directory: WiFiUsageMeter
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=WiFiUsageMeter/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='org.wifiusagemeter.app'" apk-badging.txt
          grep -q "versionName='1.0.0'" apk-badging.txt
          cp "$APK" WiFi-Usage-Meter-v1.apk
          sha256sum WiFi-Usage-Meter-v1.apk > WiFi-Usage-Meter-v1.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Usage-Meter-v1
          path: |
            WiFi-Usage-Meter-v1.apk
            WiFi-Usage-Meter-v1.sha256
      - name: Publish APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f WiFi-Usage-Meter-v1.apk WiFi-Usage-Meter-v1.sha256
          git commit -m 'Publish WiFi Usage Meter v1 APK [skip ci]' || true
          git push origin HEAD:wifi-usage-meter-v1
  result:
    if: always() && (github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-USAGE-METER-CHUNKED')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record status
        run: |
          echo '${{ needs.build.result }}' > wifi-usage-meter-chunked-result.txt
          echo "$GITHUB_RUN_ID" > wifi-usage-meter-chunked-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wifi-usage-meter-chunked-result.txt wifi-usage-meter-chunked-run.txt
          git commit -m 'Record WiFi Usage Meter build status [skip ci]' || true
          git push origin main || true
