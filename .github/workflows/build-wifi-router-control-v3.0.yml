name: Build WiFi Control v3.0 Android + Windows

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  android-and-core:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-CONTROL-V3.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-router-control
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile shared core, Android and desktop JAR
        run: gradle --no-daemon :core:build :app:assembleDebug :desktop:jar --stacktrace
      - name: Verify Android APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.txt
          grep -q "versionName='3.0.0'" /tmp/apk.txt
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/WiFi-Control-v3.0-Android.apk
          sha256sum /tmp/WiFi-Control-v3.0-Android.apk > /tmp/WiFi-Control-v3.0-Android.sha256
          cp desktop/build/libs/desktop.jar /tmp/WiFi-Control-v3.0-Desktop.jar
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-v3.0-Android
          path: |
            /tmp/WiFi-Control-v3.0-Android.apk
            /tmp/WiFi-Control-v3.0-Android.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-v3.0-Desktop-JAR
          path: /tmp/WiFi-Control-v3.0-Desktop.jar

  windows:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-CONTROL-V3.0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-router-control
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build desktop fat JAR
        shell: pwsh
        run: gradle --no-daemon :desktop:jar --stacktrace
      - name: Package Windows native app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-input | Out-Null
          Copy-Item desktop/build/libs/desktop.jar dist-input/WiFiControl.jar
          jpackage --type app-image --name WiFiControl --input dist-input --main-jar WiFiControl.jar --main-class org.sayeh.wificontrol.desktop.DesktopMainKt --dest dist
          Compress-Archive -Path dist/WiFiControl/* -DestinationPath WiFi-Control-v3.0-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-v3.0-Windows
          path: WiFi-Control-v3.0-Windows.zip
