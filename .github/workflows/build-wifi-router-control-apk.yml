name: Build WiFi Router Control APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wifi-router-control-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-router-control
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build safe TP-Link controller APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk /tmp/WiFi-Control-TPLink-TD-W8961N-v1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-TPLink-TD-W8961N-v1
          path: /tmp/WiFi-Control-TPLink-TD-W8961N-v1.apk
          if-no-files-found: error
      - name: Publish APK to main
        run: |
          git fetch origin main
          git checkout main
          cp /tmp/WiFi-Control-TPLink-TD-W8961N-v1.apk ./WiFi-Control-TPLink-TD-W8961N-v1.apk
          echo "$GITHUB_RUN_ID" > wifi-control-build-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f WiFi-Control-TPLink-TD-W8961N-v1.apk wifi-control-build-run.txt
          git commit -m 'Publish WiFi Control TP-Link APK v1' || exit 0
          git push origin main
