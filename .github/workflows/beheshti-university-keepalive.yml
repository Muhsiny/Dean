name: Beheshti University Keepalive

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/beheshti-university-keepalive.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: beheshti-university-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Keep Beheshti University warm
        shell: bash
        run: |
          set -euo pipefail
          URL='https://beheshti-university-prod-v410.onrender.com/api/health'
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --connect-timeout 15 --max-time 60 "$URL" || true)"
            if printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q '"service":"beheshti-university"' && printf '%s' "$body" | grep -q '"ready":true'; then
              version="$(printf '%s' "$body" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
              echo "Beheshti University ${version:-unknown} is warm and healthy."
              exit 0
            fi
            sleep 10
          done
          echo 'University health endpoint did not return a ready response.' >&2
          exit 1
