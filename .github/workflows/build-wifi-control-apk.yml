name: Build WiFi Control CLI v5 APK
on:
  push:
    branches: [ wifi-control-cli-v5 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify real CLI markers
        run: |
          grep -q '5.0.0-cli-real' app/build.gradle.kts
          grep -q 'rtwlan showmactable' core/src/main/kotlin/org/sayeh/wificontrol/core/TelnetRouter.kt
          grep -q 'rt node accesspolicy' core/src/main/kotlin/org/sayeh/wificontrol/core/TelnetRouter.kt
          grep -q 'rt node save' core/src/main/kotlin/org/sayeh/wificontrol/core/TelnetRouter.kt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee WiFi-Control-CLI-v5.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-CLI-v5-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            WiFi-Control-CLI-v5.sha256
