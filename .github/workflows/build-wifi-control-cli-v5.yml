name: Build WiFi Control CLI v5.2
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-wifi-control-cli-v5.yml'
  push:
    branches: [ wifi-control-cli-v5-2-fix ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify v5.2 CLI engine
        run: |
          grep -q '5.2.0-cli-persistent' app/build.gradle
          grep -q 'MainActivityV52' app/src/main/AndroidManifest.xml
          grep -q 'openWithRetry' app/src/main/java/com/sayeh/aifilm/MainActivityV52.java
          grep -q 'rt node index' app/src/main/java/com/sayeh/aifilm/MainActivityV52.java
          ! grep -q 'rtwlan node index' app/src/main/java/com/sayeh/aifilm/MainActivityV52.java
          grep -q 'rtwlan showmactable' app/src/main/java/com/sayeh/aifilm/MainActivityV52.java
          grep -q 'rt node acladdentry' app/src/main/java/com/sayeh/aifilm/MainActivityV52.java
          grep -q 'rt node accesspolicy' app/src/main/java/com/sayeh/aifilm/MainActivityV52.java
          grep -q 'rt node save' app/src/main/java/com/sayeh/aifilm/MainActivityV52.java
          sha256sum app/build/outputs/apk/debug/app-debug.apk > WiFi-Control-CLI-v5.2.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-CLI-v5.2-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            WiFi-Control-CLI-v5.2.sha256
