name: Build WiFi Control CLI v5
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-wifi-control-cli-v5.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify CLI engine markers
        run: |
          grep -q "5.0.0-cli-real" app/build.gradle
          grep -q "TelnetClient" app/src/main/java/com/sayeh/aifilm/MainActivity.java
          grep -q "rtwlan showmactable" app/src/main/java/com/sayeh/aifilm/MainActivity.java
          grep -q "rt node accesspolicy" app/src/main/java/com/sayeh/aifilm/MainActivity.java
          grep -q "rt node save" app/src/main/java/com/sayeh/aifilm/MainActivity.java
          sha256sum app/build/outputs/apk/debug/app-debug.apk > WiFi-Control-CLI-v5.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-CLI-v5-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            WiFi-Control-CLI-v5.sha256
