name: Build WiFi Usage Meter v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wifi-usage-meter-v1.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-USAGE-METER-NATIVE-V1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-usage-meter-native-v1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build native APK
        working-directory: real-control
        run: gradle --no-daemon :androidApp:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=real-control/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='org.wifiusagemeter.app'" apk-badging.txt
          grep -q "versionName='1.0.0'" apk-badging.txt
          grep -q "application-label:'WiFi Usage Meter'" apk-badging.txt
          cp "$APK" WiFi-Usage-Meter-v1.apk
          sha256sum WiFi-Usage-Meter-v1.apk > WiFi-Usage-Meter-v1.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Usage-Meter-v1
          path: |
            WiFi-Usage-Meter-v1.apk
            WiFi-Usage-Meter-v1.sha256
          if-no-files-found: error

      - name: Publish APK to app branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f WiFi-Usage-Meter-v1.apk WiFi-Usage-Meter-v1.sha256
          git commit -m 'Publish WiFi Usage Meter v1 APK [skip ci]' || true
          git push origin HEAD:wifi-usage-meter-native-v1

  publish-result:
    if: always() && (github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-USAGE-METER-NATIVE-V1')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record build result
        run: |
          printf 'build=%s\n' '${{ needs.build.result }}' > wifi-usage-meter-v1-results.txt
          echo "$GITHUB_RUN_ID" > wifi-usage-meter-v1-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wifi-usage-meter-v1-results.txt wifi-usage-meter-v1-run.txt
          git commit -m 'Publish WiFi Usage Meter v1 build result [skip ci]' || true
          git push origin main || true
