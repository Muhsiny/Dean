name: Build Takht Beheshti APK v2

on:
  push:
    branches: [takhtbeheshti-apk-v2]
    paths-ignore:
      - 'build-info-v2.txt'
      - 'Madrasah-Mohammadia-Takht-v2.apk'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use school logo
        run: |
          if curl -fL --retry 2 'https://app-61p2x9.v2.appdeploy.ai/resources/school-logo.jpg' -o takht-android/app/src/main/res/drawable/school_logo.jpg; then rm -f takht-android/app/src/main/res/drawable/school_logo.xml; fi
      - name: Build installable APK
        working-directory: takht-android
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp takht-android/app/build/outputs/apk/debug/app-debug.apk 'Madrasah-Mohammadia-Takht-v2.apk'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madrasah-Mohammadia-Takht-APK-v2
          path: Madrasah-Mohammadia-Takht-v2.apk
          if-no-files-found: error
      - name: Record workflow run
        run: echo "$GITHUB_RUN_ID" > build-info-v2.txt
      - name: Commit run id
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-info-v2.txt
          git commit -m 'Record corrected APK workflow run'
          git push origin HEAD:takhtbeheshti-apk-v2
