name: Build Corrected Takht APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-takht-apk-corrected.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: takhtbeheshti-apk-v2
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use school logo
        run: |
          if curl -fL --retry 2 'https://app-61p2x9.v2.appdeploy.ai/resources/school-logo.jpg' -o takht-android/app/src/main/res/drawable/school_logo.jpg; then rm -f takht-android/app/src/main/res/drawable/school_logo.xml; fi
      - name: Build corrected APK
        working-directory: takht-android
        run: gradle --no-daemon assembleDebug
      - name: Publish corrected APK to main
        run: |
          cp takht-android/app/build/outputs/apk/debug/app-debug.apk /tmp/Madrasah-Mohammadia-Takht-v2.apk
          git fetch origin main
          git checkout main
          cp /tmp/Madrasah-Mohammadia-Takht-v2.apk ./Madrasah-Mohammadia-Takht-v2.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f Madrasah-Mohammadia-Takht-v2.apk
          git commit -m 'Publish corrected Takht APK v1.0.1'
          git push origin main
# rebuild-trigger-2
