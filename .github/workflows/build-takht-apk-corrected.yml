name: Temporary Build WiFi Control APK

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, '[BUILD WIFI CONTROL APK]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-router-control
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build WiFi Control APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace > /tmp/wifi-build.log 2>&1
          code=$?
          echo "$code" > /tmp/wifi-build-status.txt
          set -e
          if [ "$code" -eq 0 ]; then cp app/build/outputs/apk/debug/app-debug.apk /tmp/WiFi-Control-TPLink-TD-W8961N-v1.apk; fi
      - name: Publish WiFi build result to main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          cp /tmp/wifi-build.log ./wifi-control-build.log || true
          cp /tmp/wifi-build-status.txt ./wifi-control-build-status.txt || true
          if [ -f /tmp/WiFi-Control-TPLink-TD-W8961N-v1.apk ]; then cp /tmp/WiFi-Control-TPLink-TD-W8961N-v1.apk ./WiFi-Control-TPLink-TD-W8961N-v1.apk; fi
          echo "$GITHUB_RUN_ID" > wifi-control-build-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f wifi-control-build.log wifi-control-build-status.txt wifi-control-build-run.txt
          if [ -f WiFi-Control-TPLink-TD-W8961N-v1.apk ]; then git add -f WiFi-Control-TPLink-TD-W8961N-v1.apk; fi
          git commit -m 'Publish WiFi Control TP-Link build result' || exit 0
          git push origin main
