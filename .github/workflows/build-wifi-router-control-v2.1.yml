name: Build WiFi Router Control APK v2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wifi-router-control-v2.1.yml'
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  build:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-CONTROL-V2.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-router-control
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v2.1 and capture log
        id: build_step
        shell: bash
        run: |
          set +e
          gradle --no-daemon clean assembleDebug --stacktrace > /tmp/wifi-v2.1-build.log 2>&1
          rc=$?
          cat /tmp/wifi-v2.1-build.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify APK
        if: steps.build_step.outputs.rc == '0'
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='org.sayeh.wificontrol'" /tmp/apk-badging.txt
          grep -q "versionName='2.1.0'" /tmp/apk-badging.txt
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/WiFi-Control-TPLink-TD-W8961N-v2.1.apk
          sha256sum /tmp/WiFi-Control-TPLink-TD-W8961N-v2.1.apk > /tmp/WiFi-Control-TPLink-TD-W8961N-v2.1.sha256
      - name: Upload APK artifact
        if: steps.build_step.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-TPLink-TD-W8961N-v2.1
          path: |
            /tmp/WiFi-Control-TPLink-TD-W8961N-v2.1.apk
            /tmp/WiFi-Control-TPLink-TD-W8961N-v2.1.sha256
          if-no-files-found: error
      - name: Publish result to main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          cp /tmp/wifi-v2.1-build.log ./wifi-control-v2.1-build.log
          echo "$GITHUB_RUN_ID" > wifi-control-v2.1-build-run.txt
          echo "${{ steps.build_step.outputs.rc }}" > wifi-control-v2.1-build-exit.txt
          if [ "${{ steps.build_step.outputs.rc }}" = "0" ]; then
            cp /tmp/WiFi-Control-TPLink-TD-W8961N-v2.1.apk ./WiFi-Control-TPLink-TD-W8961N-v2.1.apk
            cp /tmp/WiFi-Control-TPLink-TD-W8961N-v2.1.sha256 ./WiFi-Control-TPLink-TD-W8961N-v2.1.sha256
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f wifi-control-v2.1-build.log wifi-control-v2.1-build-run.txt wifi-control-v2.1-build-exit.txt
          if [ "${{ steps.build_step.outputs.rc }}" = "0" ]; then git add -f WiFi-Control-TPLink-TD-W8961N-v2.1.apk WiFi-Control-TPLink-TD-W8961N-v2.1.sha256; fi
          git commit -m 'Publish WiFi Control TP-Link v2.1 build result'
          git push origin main
      - name: Fail if build failed
        if: steps.build_step.outputs.rc != '0'
        run: exit 1
