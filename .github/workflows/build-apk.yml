name: Build Sayeh AI Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Bundle offline Persian neural TTS engine and model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/jniLibs

          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v1.13.4/sherpa-onnx/kotlin-api/Tts.kt' \
            -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt
          grep -q '^package com.k2fsa.sherpa.onnx' app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt

          curl -fL --retry 3 \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fa_IR-amir-medium.tar.bz2' \
            -o /tmp/fa-model.tar.bz2
          tar -xjf /tmp/fa-model.tar.bz2 -C app/src/main/assets
          test -f app/src/main/assets/vits-piper-fa_IR-amir-medium/fa_IR-amir-medium.onnx
          test -f app/src/main/assets/vits-piper-fa_IR-amir-medium/tokens.txt
          test -d app/src/main/assets/vits-piper-fa_IR-amir-medium/espeak-ng-data

          curl -fL --retry 3 \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-v1.13.4-android.tar.bz2' \
            -o /tmp/sherpa-android.tar.bz2
          mkdir -p /tmp/sherpa-android
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa-android

          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            while IFS= read -r lib; do
              cp -v "$lib" "app/src/main/jniLibs/$abi/"
            done < <(find /tmp/sherpa-android -type f -path "*/$abi/*.so" | sort -u)
            test -f "app/src/main/jniLibs/$abi/libsherpa-onnx-jni.so"
            test -f "app/src/main/jniLibs/$abi/libonnxruntime.so"
          done

          echo 'Bundled model:'
          du -sh app/src/main/assets/vits-piper-fa_IR-amir-medium
          echo 'Bundled native libraries:'
          du -sh app/src/main/jniLibs

      - name: Build standalone APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contains internal Persian model and native engine
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/vits-piper-fa_IR-amir-medium/fa_IR-amir-medium.onnx'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libonnxruntime.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sayeh-AI-Film-Studio-v2-offline-persian
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
