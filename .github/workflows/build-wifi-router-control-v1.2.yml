name: Build WiFi Router Control APK v1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wifi-router-control-v1.2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-router-control
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v1.2
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='org.sayeh.wificontrol'" /tmp/apk-badging.txt
          grep -q "versionName='1.2.0'" /tmp/apk-badging.txt
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/WiFi-Control-TPLink-TD-W8961N-v1.2.apk
          sha256sum /tmp/WiFi-Control-TPLink-TD-W8961N-v1.2.apk > /tmp/WiFi-Control-TPLink-TD-W8961N-v1.2.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-TPLink-TD-W8961N-v1.2
          path: |
            /tmp/WiFi-Control-TPLink-TD-W8961N-v1.2.apk
            /tmp/WiFi-Control-TPLink-TD-W8961N-v1.2.sha256
          if-no-files-found: error
      - name: Publish to main
        run: |
          git fetch origin main
          git checkout main
          cp /tmp/WiFi-Control-TPLink-TD-W8961N-v1.2.apk ./WiFi-Control-TPLink-TD-W8961N-v1.2.apk
          cp /tmp/WiFi-Control-TPLink-TD-W8961N-v1.2.sha256 ./WiFi-Control-TPLink-TD-W8961N-v1.2.sha256
          echo "$GITHUB_RUN_ID" > wifi-control-v1.2-build-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f WiFi-Control-TPLink-TD-W8961N-v1.2.apk WiFi-Control-TPLink-TD-W8961N-v1.2.sha256 wifi-control-v1.2-build-run.txt
          git commit -m 'Publish verified WiFi Control TP-Link APK v1.2'
          git push origin main
