name: Build WiFi Control Real v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wifi-control-real-v3.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  android:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-CONTROL-REAL-V3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-control-real-v3
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble hardened v3 engine
        run: |
          printf '\n' >> real-control/shared/router_adapter.js
          cat real-control/shared/router_adapter_v3_patch.js >> real-control/shared/router_adapter.js
          node --check real-control/shared/router_adapter.js
          grep -q "R.version='3.0.0'" real-control/shared/router_adapter.js
          grep -q "home_wlan_1" real-control/shared/router_adapter.js
          grep -q "ACCESS_MAC_FILTER" real-control/shared/router_adapter.js
      - name: Build Android
        working-directory: real-control
        run: gradle --no-daemon :androidApp:assembleDebug --stacktrace
      - name: Verify Android APK
        run: |
          APK=real-control/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk.txt
          grep -q "package: name='org.sayeh.realwifi'" apk.txt
          grep -q "versionName='3.0.0-real'" apk.txt
          unzip -p "$APK" assets/router_adapter.js > packed-router-adapter.js
          grep -q "R.version='3.0.0'" packed-router-adapter.js
          grep -q "home_wlan_1" packed-router-adapter.js
          node --check packed-router-adapter.js
          cp "$APK" WiFi-Control-Real-v3-Android.apk
          sha256sum WiFi-Control-Real-v3-Android.apk > WiFi-Control-Real-v3-Android.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-Real-v3-Android
          path: |
            WiFi-Control-Real-v3-Android.apk
            WiFi-Control-Real-v3-Android.sha256

  windows:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-CONTROL-REAL-V3'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-control-real-v3
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble hardened v3 engine
        shell: pwsh
        run: |
          Add-Content real-control/shared/router_adapter.js "`n"
          Get-Content real-control/shared/router_adapter_v3_patch.js | Add-Content real-control/shared/router_adapter.js
          node --check real-control/shared/router_adapter.js
          if (-not (Select-String -Path real-control/shared/router_adapter.js -SimpleMatch "R.version='3.0.0'")) { throw 'v3 patch missing' }
      - name: Build Windows x64
        shell: pwsh
        run: |
          dotnet restore real-control/windowsApp/WifiControl.Real.Windows.csproj
          dotnet publish real-control/windowsApp/WifiControl.Real.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/WiFiControlReal
          if (!(Test-Path dist/WiFiControlReal/WiFiControlReal.exe)) { throw 'WiFiControlReal.exe missing' }
          if (!(Test-Path dist/WiFiControlReal/router_adapter.js)) { throw 'router_adapter.js missing' }
          if (-not (Select-String -Path dist/WiFiControlReal/router_adapter.js -SimpleMatch "R.version='3.0.0'")) { throw 'packed v3 engine missing' }
          Compress-Archive -Path dist/WiFiControlReal/* -DestinationPath WiFi-Control-Real-v3-Windows.zip
          (Get-FileHash WiFi-Control-Real-v3-Windows.zip -Algorithm SHA256).Hash.ToLower() | Out-File WiFi-Control-Real-v3-Windows.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-Control-Real-v3-Windows
          path: |
            WiFi-Control-Real-v3-Windows.zip
            WiFi-Control-Real-v3-Windows.sha256

  publish-result:
    if: always() && (github.event_name != 'issues' || github.event.issue.title == 'TRIGGER-WIFI-CONTROL-REAL-V3')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record build result
        run: |
          printf 'android=%s\nwindows=%s\n' '${{ needs.android.result }}' '${{ needs.windows.result }}' > wifi-control-real-v3-results.txt
          echo "$GITHUB_RUN_ID" > wifi-control-real-v3-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wifi-control-real-v3-results.txt wifi-control-real-v3-run.txt
          git commit -m 'Publish WiFi Control Real v3 build result' || true
          git push origin main || true

# deterministic v3 trigger
